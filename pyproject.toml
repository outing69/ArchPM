[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "archpm"
description = "Process manager and monitor for a Linux gaming PC: PySide6 GUI, sampler agent and Plasma 6 widget"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex" }]
requires-python = ">=3.10"
# Floors, not what the author happens to run (3.14 / 6.11 / 7.2):
#   Python 3.10  - dataclass(slots=True)
#   PySide6 6.5  - scoped enums (Qt.ItemDataRole.*, QPalette.ColorRole.*) as used throughout
#   psutil 5.9   - IOPRIO_CLASS_* constants and Process.oneshot()
dependencies = [
    "PySide6>=6.5",
    "psutil>=5.9",
]
dynamic = ["version"]
keywords = ["process-manager", "system-monitor", "gpu", "plasma", "arch-linux"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/outing69/ArchPM"
Issues = "https://github.com/outing69/ArchPM/issues"

[project.scripts]
archpm = "archpm.ui.app:main"
archpm-agent = "archpm.agent:main"

[tool.setuptools]
packages = ["archpm", "archpm.root", "archpm.ui"]

[tool.setuptools.dynamic]
version = { attr = "archpm.__version__" }


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = [
    "PLR2004",  # magic-value comparisons: thresholds like 85 and 60 are the point here
    "PLR0913",  # many arguments: Qt widget constructors legitimately take several
    "PLR0912", "PLR0915", "PLR0911",  # branch/statement counts: paintEvent and data() are long by nature
    "E701", "E702",  # helper.py builds its argparse tree on compact lines on purpose
    "SIM105",   # an explicit try/except-pass reads clearer than contextlib.suppress here
    "PLC0415",  # lazy imports are deliberate: the root panel and helper load on demand
    "PLR0917",  # Graph() takes its options positionally by design
]

[tool.ruff.lint.per-file-ignores]
"archpm/ui/proc_model.py" = ["B008"]  # parent=QModelIndex() is the Qt convention

[tool.ruff.lint.isort]
known-first-party = ["archpm"]
